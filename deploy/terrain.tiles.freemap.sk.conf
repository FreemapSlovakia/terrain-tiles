# nginx vhost for terrain-tiles on fm6, proxying the service on 127.0.0.1:3040.
#
# First install (needs the DNS record terrain.tiles.freemap.sk → fm6):
#   cp deploy/terrain.tiles.freemap.sk.conf /etc/nginx/sites-available/terrain.tiles.freemap.sk
#   ln -s ../sites-available/terrain.tiles.freemap.sk /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d terrain.tiles.freemap.sk
# then add `listen 443 quic;` and `listen [::]:443 quic;` beside certbot's
# `listen 443 ssl` lines; QUIC fails `nginx -t` until the certificate exists.

server {
    listen 80;
    listen [::]:80;

    server_name terrain.tiles.freemap.sk;

    # The query may carry an app token; this format masks it.
    access_log /var/log/nginx/access.log shading_combined;

    # Premium zooms (16+) are gated by the web app repo's
    # etc/nginx/conf.d/shading-tile-gate.conf and snippets/shading-tile-auth.conf.
    include snippets/shading-tile-auth.conf;

    location / {
        # The web app's premium tiles carry Authorization, which preflights; the
        # service answers only GET.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Headers "Authorization";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }

        auth_request /_shading-auth;
        error_page 401 403 = @shading_premium_zoom;

        proxy_pass http://127.0.0.1:3040;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nothing is cached here: browsers cache by the service's
        # Cache-Control and revalidate with If-Modified-Since. CORS,
        # X-Attribution, Cache-Control and Last-Modified come from the service
        # itself; do not add them here.
    }

    http2 on;
}
