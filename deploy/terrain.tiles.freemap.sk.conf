# nginx vhost for terrain-tiles on fm6, proxying the service on 127.0.0.1:3040.
#
# First install (needs the DNS record terrain.tiles.freemap.sk → fm6):
#   cp deploy/terrain.tiles.freemap.sk.conf /etc/nginx/sites-available/terrain.tiles.freemap.sk
#   ln -s ../sites-available/terrain.tiles.freemap.sk /etc/nginx/sites-enabled/
#   mkdir -p /fm/storage1/nginx-proxy-cache/terrain-tiles && chown www-data: $_
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d terrain.tiles.freemap.sk
# then add `listen 443 quic;` and `listen [::]:443 quic;` beside certbot's
# `listen 443 ssl` lines; QUIC fails `nginx -t` until the certificate exists.

# Keyed by the full URI: a server-rendered style lives in the query string.
proxy_cache_path /fm/storage1/nginx-proxy-cache/terrain-tiles levels=1:2 keys_zone=TERRAIN_TILES:50m inactive=30d max_size=50g use_temp_path=off;

server {
    listen 80;
    listen [::]:80;

    server_name terrain.tiles.freemap.sk;

    location / {
        proxy_pass http://127.0.0.1:3040;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold tile is read off HDDs; several requests for it wait for one.
        proxy_cache TERRAIN_TILES;
        proxy_cache_key $request_uri;
        proxy_cache_lock on;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating;

        # Kept an hour whatever the service tells browsers, then revalidated
        # with If-Modified-Since, which it answers from footprints alone.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_revalidate on;

        # CORS, X-Attribution, Cache-Control and Last-Modified come from the
        # service itself; do not add them here.
        add_header X-Cache $upstream_cache_status always;
    }

    http2 on;
}
