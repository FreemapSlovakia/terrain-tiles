# nginx vhost for terrain-tiles on fm6, proxying the service on 127.0.0.1:3040.
#
# First install (needs the DNS record terrain.tiles.freemap.sk → fm6):
#   cp deploy/terrain.tiles.freemap.sk.conf /etc/nginx/sites-available/terrain.tiles.freemap.sk
#   ln -s ../sites-available/terrain.tiles.freemap.sk /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d terrain.tiles.freemap.sk
# then add `listen 443 quic;` and `listen [::]:443 quic;` beside certbot's
# `listen 443 ssl` lines; QUIC fails `nginx -t` until the certificate exists.

server {
    listen 80;
    listen [::]:80;

    server_name terrain.tiles.freemap.sk;

    location / {
        proxy_pass http://127.0.0.1:3040;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nothing is cached here: browsers cache by the service's
        # Cache-Control and revalidate with If-Modified-Since. CORS,
        # X-Attribution, Cache-Control and Last-Modified come from the service
        # itself; do not add them here.
    }

    http2 on;
}
